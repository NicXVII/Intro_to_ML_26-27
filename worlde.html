<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wordle — Italiano</title>

<style>

:root {

--bg: #121213;

--cell-empty: #3a3a3c;

--cell-border: #565758;

--green: #538d4e;

--yellow: #b59f3b;

--gray: #3a3a3c;

--text: #ffffff;

--keyboard-bg: #1a1a1c;

--key-bg: #8d8d8f;

--key-text: #1a1a1c;

--accent: #538d4e;

}

{ margin: 0; padding: 0; box-sizing: border-box; }

body {

background: var(--bg);

color: var(--text);

font-family: 'Segoe UI', system-ui, sans-serif;

display: flex;

flex-direction: column;

align-items: center;

min-height: 100vh;

user-select: none;

}

header {

width: 100%;

display: flex;

justify-content: space-between;

align-items: center;

padding: 12px 20px;

border-bottom: 1px solid var(--cell-border);

}

header h1 {

font-size: 1.6rem;

font-weight: 800;

letter-spacing: 2px;

}

header .stats {

display: flex;

gap: 20px;

text-align: center;

font-size: 0.85rem;

}

header .stats span {

display: block;

font-size: 1.3rem;

font-weight: 700;

}

.modal-overlay {

position: fixed;

inset: 0;

background: rgba(0,0,0,0.6);

display: none;

align-items: center;

justify-content: center;

z-index: 100;

}

.modal-overlay.active { display: flex; }

.modal {

background: #1e1e20;

border: 1px solid var(--cell-border);

border-radius: 12px;

padding: 28px 36px;

max-width: 380px;

width: 90%;

text-align: center;

}

.modal h2 { margin-bottom: 10px; font-size: 1.2rem; }

.modal p { font-size: 0.9rem; line-height: 1.5; color: #b0b0b0; }

.modal .close-btn {

margin-top: 18px;

background: var(--accent);

color: #fff;

border: none;

padding: 8px 24px;

border-radius: 8px;

cursor: pointer;

font-weight: 600;

}

.board {

display: grid;

grid-template-columns: repeat(5, 2fr);

grid-template-rows: repeat(6, 2fr);

gap: 6px;

padding: 20px;

width: min(340px, 90vw);

height: min(420px, calc(90vw 420 / 340));

}
